name: NETIZENS World QA

on:
  pull_request:
    paths:
      - "prototype/netizens-world/**"
      - "supabase/**"
      - ".github/workflows/netizens-world.yml"
  push:
    branches: [main]
    paths:
      - "prototype/netizens-world/**"
      - "supabase/**"
      - ".github/workflows/netizens-world.yml"

jobs:
  database-privileges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: netizens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: netizens_test
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce Supabase role defaults in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply repository migrations in order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Verify effective privileges and authenticated behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/effective-privileges.sql
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check prototype/netizens-world/world-state.js
          node --check prototype/netizens-world/app.js
          node --check prototype/netizens-world/data-adapter.js
          node --check prototype/netizens-world/perception-client.js
          node --check prototype/netizens-world/participation-ui.js
      - name: Persistent world state tests
        run: node prototype/netizens-world/qa.mjs
      - name: Participation adapter tests
        run: node prototype/netizens-world/participation-adapter-qa.mjs
      - name: Participatory entity UI tests
        run: node prototype/netizens-world/participation-ui-qa.mjs
      - name: Backend contract tests
        run: node prototype/netizens-world/backend/contract-qa.mjs
      - name: Production database contract tests
        run: node prototype/netizens-world/backend/production-contract-qa.mjs
      - name: Required shell checks
        run: |
          grep -q 'id="enterWorld"' prototype/netizens-world/index.html
          grep -q 'id="timeMachineDialog"' prototype/netizens-world/index.html
          grep -q 'id="futureScenario"' prototype/netizens-world/index.html
          grep -q 'world-state.js' prototype/netizens-world/index.html
          grep -q 'participation-ui.js' prototype/netizens-world/index.html
          grep -q 'participation.css' prototype/netizens-world/index.html
          grep -q 'id="notificationPanel"' prototype/netizens-world/index.html
